<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifteen Puzzle Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #dfebd5;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="fifteen"></div>
    <script>
        var setup = {
            puzzle_fifteen: {
                diff: 300,
                size: [512, 640],
                grid: [3, 4],
                fill: true,
                number: true,
                art: {
                    url: "https://picsum.photos/512/640?random=2",
                    ratio: false
                },
                keyBoard: true,
                gamePad: true,
                time: 0.4,
                style: "border-radius: 12px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);"
            }
        };
    </script>
    <script src="fifteen_puzzle.js"></script>
</body>
</html>
